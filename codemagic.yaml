workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd admin_app
          flutter pub get
      - name: Build Android APK
        script: |
          cd admin_app
          flutter build apk --release
    artifacts:
      - admin_app/build/app/outputs/flutter-apk/*.apk
      
